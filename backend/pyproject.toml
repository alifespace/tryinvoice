[project]
name = "tryinvoice-backend"
version = "0.1.0"
description = "TryInvoice 后端服务"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "openpyxl>=3.1,<4",
    "PyMuPDF>=1.25.0,<2",
    "PyJWT[crypto]>=2.10",
    "pydantic>=2.10.0,<3",
    "pydantic-settings>=2.7.0,<3",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0.1",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pip-audit>=2.8.0",
    "pixeltable-pgserver",
    "pyyaml>=6.0.2",
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "radon>=6.0.0",
    "ruff>=0.11.0",
    "types-openpyxl",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
