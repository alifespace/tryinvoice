services:
  - type: web
    name: tryinvoice-test-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: staging
      - key: PORT
        value: "8000"
      - key: STORAGE_REGION
        value: auto
      - key: STORAGE_PRESIGN_TTL_SECONDS
        value: "900"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: SUPABASE_JWKS_CACHE_SECONDS
        value: "600"
      - key: SUPABASE_JWKS_TIMEOUT_SECONDS
        value: "3.0"
      - key: SUPABASE_ALLOW_LEGACY_HS256
        value: "false"
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: STORAGE_ENDPOINT_URL
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
