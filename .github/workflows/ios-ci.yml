name: iOS CI

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      XCODE_APP: /Applications/Xcode_16.4.app
      SIM_DEVICE: iPhone 16
      SIM_OS: "18.5"
      XCODEGEN_VERSION: 2.42.0
    steps:
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_APP"
      - name: Probe Apple toolchain
        run: bash ios/scripts/ci-probe.sh
      - name: Build and test
        run: bash ios/scripts/ci-build-test.sh
      # v4.6.2
      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-ci-diagnostics
          path: |
            ios/build/ci/*.xcresult
            ios/build/ci/logs/*.log
            ios/build/ci/screenshots/**
          if-no-files-found: ignore
          retention-days: 14
