name: iOS CI

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      XCODE_APP: /Applications/Xcode_16.4.app
      SIM_DEVICE: iPhone 16
      SIM_OS: "18.5"
      XCODEGEN_VERSION: 2.42.0
    steps:
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Select Xcode
        run: sudo xcode-select -s "$XCODE_APP"
      - name: Probe Apple toolchain
        run: bash ios/scripts/ci-probe.sh
      - name: Build and test
        env:
          TEST_RUNNER_TRYINVOICE_SEAM_API_BASE_URL: ${{ secrets.TRYINVOICE_TEST_API_BASE_URL }}
          TEST_RUNNER_TRYINVOICE_SEAM_SUPABASE_URL: ${{ secrets.TRYINVOICE_TEST_SUPABASE_URL }}
          TEST_RUNNER_TRYINVOICE_SEAM_SUPABASE_ANON_KEY: ${{ secrets.TRYINVOICE_TEST_SUPABASE_ANON_KEY }}
          TEST_RUNNER_TRYINVOICE_SEAM_EMAIL: ${{ secrets.TRYINVOICE_TEST_EMAIL }}
          TEST_RUNNER_TRYINVOICE_SEAM_PASSWORD: ${{ secrets.TRYINVOICE_TEST_PASSWORD }}
          TEST_RUNNER_TRYINVOICE_SEAM_REQUIRED: "1"
        run: bash ios/scripts/ci-build-test.sh
      - name: Scan diagnostics for secrets
        id: scan_diagnostics_secrets
        if: always()
        env:
          TEST_RUNNER_TRYINVOICE_SEAM_API_BASE_URL: ${{ secrets.TRYINVOICE_TEST_API_BASE_URL }}
          TEST_RUNNER_TRYINVOICE_SEAM_SUPABASE_URL: ${{ secrets.TRYINVOICE_TEST_SUPABASE_URL }}
          TEST_RUNNER_TRYINVOICE_SEAM_SUPABASE_ANON_KEY: ${{ secrets.TRYINVOICE_TEST_SUPABASE_ANON_KEY }}
          TEST_RUNNER_TRYINVOICE_SEAM_EMAIL: ${{ secrets.TRYINVOICE_TEST_EMAIL }}
          TEST_RUNNER_TRYINVOICE_SEAM_PASSWORD: ${{ secrets.TRYINVOICE_TEST_PASSWORD }}
        run: python3 ios/scripts/ci-scan-secrets.py
      # v4.6.2
      - name: Upload CI diagnostics
        if: always() && steps.scan_diagnostics_secrets.outputs.scan_complete == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-ci-diagnostics
          path: |
            ios/build/ci/*.xcresult
            ios/build/ci/logs/*.log
            ios/build/ci/screenshots/**
          if-no-files-found: ignore
          retention-days: 14
