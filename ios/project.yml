name: TryInvoice
options:
  deploymentTarget:
    iOS: "17.0"
  bundleIdPrefix: com.tryinvoice
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGNING_REQUIRED: YES
    CODE_SIGN_IDENTITY: "-"
packages:
  supabase-swift:
    url: https://github.com/supabase/supabase-swift
    exactVersion: 2.5.1
targets:
  TryInvoice:
    type: application
    platform: iOS
    sources:
      - path: TryInvoice
    dependencies:
      - package: supabase-swift
        product: Auth
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: TryInvoice/TryInvoice.entitlements
    info:
      path: build/Info.plist
      properties:
        API_BASE_URL: "$(API_BASE_URL)"
        SUPABASE_URL: "$(SUPABASE_URL)"
        SUPABASE_ANON_KEY: "$(SUPABASE_ANON_KEY)"
        NSCameraUsageDescription: "用于扫描纸质票据并在本机生成离线记录。"
        UILaunchScreen: {}
  TryInvoiceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TryInvoiceTests
    dependencies:
      - target: TryInvoice
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.tryinvoice.TryInvoiceTests
        CODE_SIGN_ENTITLEMENTS: TryInvoiceTests/TryInvoiceTests.entitlements
  TryInvoiceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TryInvoiceUITests
    dependencies:
      - target: TryInvoice
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.tryinvoice.TryInvoiceUITests
schemes:
  TryInvoice:
    build:
      targets:
        TryInvoice: all
    test:
      config: Debug
      targets:
        - TryInvoiceTests
        - TryInvoiceUITests
    management:
      shared: true
