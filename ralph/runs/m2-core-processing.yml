# 一个全新 Ralph loop 按顺序完成 M2.1、M2.2、M2.3；不得用 --continue 继承 M1 事件。
cli:
  backend: custom
  command: ./ralph/claude.mjs
  args: ["--model", "sonnet", "--effort", "high", "--stage", "plan"]
  prompt_mode: arg

event_loop:
  prompt_file: ralph/prompts/m2-core-processing.md
  starting_event: work.start
  completion_promise: LOOP_COMPLETE
  cancellation_promise: loop.cancel
  required_events: [spec.ready, build.done, review.accepted, task.done]
  max_iterations: 300
  max_runtime_seconds: 86400
  max_consecutive_failures: 4
  persistent: false
  enforce_hat_scope: true

core:
  scratchpad:
    enabled: true
    path: .ralph/agent/m2-core-processing-scratchpad.md
  guardrails:
    - 每个 Hat 开始前读取 M2 设计与 Task 文档、M2 进度文件、当前 Spec 和实际代码；业务需求以 docs 为准。
    - 仅按 M2.1、M2.2、M2.3 固定顺序推进；前一 Task 未独立验收不得进入下一 Task，禁止实施 M3-M5。
    - 严禁修改 AGENTS.md、docs/hld.md、docs/lld.md、docs/milestones.md 和 docs/tasks/*.md。
    - 每个 Task 总改动量 <=1500 行，Subtask 建议 <=800 行；测试满足 Test:Feat <=1.3 或新增测试少于450行之一。
    - 只保留核心纯逻辑单测和关键路径集成测试，不对同一行为堆叠三层重复测试。
    - 所有确定性业务规则必须由程序实现；M2.1 云端兜底默认只用 Mock，不得擅自消耗真实 API credit。
    - API Key、JWT、数据库密码、个人票据和其他敏感信息不得进入仓库、日志、事件或报告。
    - Metrics 是非侵入式观测平面；任何 Hat 均不得查询、等待或验证 Metrics，也不得因观测日志失败而取消循环。
    - 所有事件参数、测试结果、代码行数与验收结论必须来自实际执行，不得预填、猜测或伪造。
    - 不发明工作流事件；只使用 work.start、spec.ready、build.done、review.accepted、review.rejected、task.replan、task.done、LOOP_COMPLETE、loop.cancel。

memories:
  enabled: false
