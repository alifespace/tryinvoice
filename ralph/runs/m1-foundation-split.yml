# 旧 M1 流水因 M1.1 边界过大而停止；本配置保留 M1.1-S1 基线并连续完成 M1.4、M1.2、M1.3。
# 仅由用户手动启动；不得使用 --continue 继承旧 loop 的 build.done 事件。
cli:
  backend: custom
  command: ./ralph/claude.mjs
  args: ["--model", "sonnet", "--effort", "high", "--stage", "plan"]
  prompt_mode: arg

event_loop:
  prompt_file: ralph/prompts/m1-foundation-split.md
  starting_event: work.start
  completion_promise: LOOP_COMPLETE
  cancellation_promise: loop.cancel
  required_events: [spec.ready, build.done, review.accepted, task.done]
  max_iterations: 300
  max_runtime_seconds: 86400
  max_consecutive_failures: 4
  persistent: false
  enforce_hat_scope: true

core:
  scratchpad:
    enabled: true
    path: .ralph/agent/m1-foundation-split-scratchpad.md
  guardrails:
    - 每个 Hat 开始前完整读取 AGENTS.md、docs/hld.md、docs/lld.md、docs/milestones.md、M1.1/M1.4/M1.2/M1.3 Task 文档及 .ralph/agent/task-progress.json（若存在）。
    - 首次 Planner 必须保留 M1.1-S1 已验收证据，把原 M1.1 标为 superseded，并为 M1.4 重新创建 Spec；未验收的 M1.1-S2 不得直接进入 Critic 或 Finalizer。
    - 故障恢复时若进度显示 M1.4-S1 已由 Critic accepted、代码快照 111 已回读，且唯一阻塞是 Finalizer 在交接前读不到自身 agent_run，Planner 必须按“Critic 已通过但 Finalizer 收尾中断”处理并发布 review.accepted 重新唤醒 Finalizer；不得重新交给 Builder，也不得沿用旧 loop.cancel 继续阻塞。
    - 故障恢复时若 M1.3-S1 的七项门禁和功能测试已通过，唯一阻塞是 Spec v1 同时要求 HTTPBearer 依赖注入、却把 deps.py 白名单限制为仅函数体/import，Planner 必须创建 Spec v2，明确允许模块级 HTTPBearer 声明和 get_current_user_id 所需的 FastAPI 依赖参数，再发布 spec.ready；该次属于 Planner Spec 缺陷，不计入 Builder 连续失败次数，不得继续沿用旧 loop.cancel。
    - 当前运行只允许按 M1.4、M1.2、M1.3 固定顺序实施；同一时刻只允许一个 active Task，禁止提前实施 M2-M5。
    - 每份 Subtask Spec 必须只属于 current_task，严禁跨 Task 混写；前一 Task 未独立验收前不得激活下一 Task。
    - 只有 M1.4、M1.2、M1.3 全部达到各自验收标准，且 M1.1-S1 既有证据完整，才能发布 LOOP_COMPLETE。
    - 严禁修改 AGENTS.md、docs/hld.md、docs/lld.md、docs/milestones.md 和 docs/tasks/*.md。
    - 严格使用 Python 3.14+、uv、FastAPI、Pydantic v2 与 PostgreSQL/Supabase 既定技术栈，不得擅自替换。
    - 每个 Task 总改动量分别控制在1500行以内，Subtask建议不超过800行；测试分别满足 Test:Feat <=1.3 或新增测试少于450行之一。
    - 只保留核心纯逻辑单测和关键路径集成测试，禁止对同一行为堆叠三层重复测试。
    - API Key、JWT、Supabase Secret、数据库密码及任何用户敏感信息不得写入仓库、日志、事件或报告。
    - 所有事件参数、测试结果、代码行数和验收结论必须来自实际执行，不得预填、猜测或伪造。
    - Finalizer 的当前 agent_run 由包装器在交接事件后入库；Finalizer 只须在进程内确认代码量快照，严禁因读不到自身尚未落库的 agent_run 而取消。Planner 收到 task.done 后再核对该 Finalizer 记录。
    - 不发明工作流事件；只使用 work.start、spec.ready、build.done、review.accepted、review.rejected、task.replan、task.done、LOOP_COMPLETE、loop.cancel。

memories:
  enabled: false
