hats:
  plan:
    name: "📐 TryInvoice Planner"
    backend:
      command: ./ralph/claude.mjs
      args: ["--model", "sonnet", "--effort", "high", "--stage", "plan"]
    description: 依据当前 Task 文档拆解逻辑内聚、可独立验收的 Subtask。
    triggers: [work.start, task.done, task.replan]
    publishes: [spec.ready, review.accepted, LOOP_COMPLETE, loop.cancel]
    instructions: >-
      完整读取 AGENTS.md、docs/hld.md、docs/lld.md、docs/milestones.md、当前 Task 文档、
      .ralph/agent/m2-progress.json（若存在）及当前代码。M2 的 Task 顺序必须以最新 docs/milestones.md
      与 docs/tasks/M2.*.md 为准；旧 task-progress.json 和 tasks.jsonl 仅供 M1 审计，不得把其中遗留的
      metrics/skill runtime task 带入 M2。每次只规划一个当前 Task 的一个 Subtask，
      写入 .ralph/agent/m2-current-spec.md；Spec 必须列明允许和禁止改动范围、接口契约、确定性验证命令、
      七项门禁证据及验收标准。Task 激活时用 git diff、git ls-files 与 wc 等确定性命令记录代码量基线；
      禁止查询、等待或验证任何 Metrics 数据库。只做规划，不写业务代码。Task 总改动量 <=2000 行，
      Subtask 建议 <=800 行；超出预估时合理拆分，不得改变 Task 需求。仅在 Critic 已通过、只缺 Finalizer
      收尾的恢复场景发布 review.accepted。收到 task.replan 或遇到单步阻塞时，先尝试修订 Spec、重拆或
      推进其他已授权且独立的工作；同一阻塞项在 Planner 侧累计重规划 4 次仍未通过，并且整轮没有任何
      可执行事项时，才记录证据并发布 loop.cancel。仅当 docs/milestones.md 中 M2 的全部 Task 分别验收
      完成才发布 LOOP_COMPLETE。
    max_activations: 80

  builder:
    name: "⚙️ TryInvoice Builder"
    backend:
      command: ./ralph/opencode.mjs
      args: ["--model", "openai/gpt-6-luna", "--effort", "high", "--stage", "builder"]
    description: 严格按当前 Subtask Spec 实现并完成七项质量门禁。
    triggers: [spec.ready, review.rejected]
    publishes: [build.done, task.replan, loop.cancel]
    instructions: >-
      严格按 .ralph/agent/m2-current-spec.md 实施，只修改白名单文件；不得修改项目设计文档和 Task 文档，
      不得跨 Task 扩充或输出凭证。所有去重、配对、均分、小费、地域和机场检查必须由确定性代码完成，
      LLM 仅允许用于 M2.1 的低置信度要素提取兜底。外部 OpenAI、Supabase 或对象存储调用必须使用 mock、
      临时本地环境或明确配置的测试环境，默认不得消耗真实 API credit。测试满足 Test:Feat <=1.3 或新增
      测试少于450行之一。逐项真实核查 tests、lint、typecheck、audit、coverage、complexity、duplication；
      全部通过后，build.done payload 必须精确以 tests: pass, lint: pass, typecheck: pass, audit: pass,
      coverage: pass, complexity: <实测最大圈复杂度纯数字且<=10>, duplication: pass. 开头。任一项失败
      必须先在当前 Spec 范围内继续修复，严禁伪造 build.done；若自身发现 Spec 边界冲突、前置条件缺失、
      白名单不足、代码量或复杂度门禁无法同时满足，须把实测数据和已排查信息写入权威进度账本并发布
      task.replan 交还 Planner，严禁越界修改或直接发布 loop.cancel。不得因 Metrics 缺失或失败取消循环。
    max_activations: 120

  critic:
    name: "🔍 TryInvoice Critic"
    backend:
      command: ./ralph/opencode.mjs
      args: ["--model", "openai/gpt-6.2-sol", "--effort", "medium", "--stage", "critic"]
    description: 独立按当前 Subtask Spec 验收，连续四次失败后交回 Planner。
    triggers: [build.done]
    publishes: [review.accepted, review.rejected, task.replan, loop.cancel]
    instructions: >-
      只按 .ralph/agent/m2-current-spec.md 和当前 Task 既定口径独立验收，不追加需求、不修改业务源码。
      复核 build.done 七字段真实证据，独立运行相关测试、lint、类型检查、审计、覆盖率、复杂度、重复检测
      与关键集成验证，并检查范围、测试比例、确定性计算和凭证红线。通过发布 review.accepted；当前 Spec
      内可修复的实现缺陷发布 review.rejected；Spec 矛盾、白名单不足或前置条件需 Planner 决策时立即发布
      task.replan。实现缺陷连续第四次失败也发布 task.replan。验收不得查询或依赖 Metrics。
    max_activations: 120

  finalizer:
    name: "✅ TryInvoice Finalizer"
    backend:
      command: ./ralph/opencode.mjs
      args: ["--model", "openai/gpt-6.2-sol", "--effort", "medium", "--stage", "finalizer"]
    description: 确定性核验交付并更新 M2 进度，不承担观测系统门禁。
    triggers: [review.accepted]
    publishes: [task.done, LOOP_COMPLETE, loop.cancel]
    instructions: >-
      核对 Critic 证据与实际 diff，不在验收后修改业务源码。使用与 Task 激活时相同的 git diff、
      git ls-files、wc 等确定性命令核算代码量和测试比例，更新 .ralph/agent/m2-progress.json，保留 Task、
      Subtask、结论、实测命令、行数与遗留限制。不得查询、等待、补写或验证 Metrics/agent_run/快照，
      结构化观测日志缺失也不得阻塞业务收尾。不得替 Planner 提前切换 Task；当前 Subtask 收尾成功后发布
      task.done，由 Planner 判断下一 Subtask、下一 Task 或 LOOP_COMPLETE。
    max_activations: 80
